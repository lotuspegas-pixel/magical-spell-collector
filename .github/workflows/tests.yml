name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer uv
        run: python -m pip install uv
      - name: Installeer project
        run: uv sync --extra dev --python 3.11 --locked
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
